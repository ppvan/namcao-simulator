# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BIN_DIR: bin
  BINS:
    - logic_gates
    - ndigits
    - quirrell
    # - prime

env:
  GOEXPERIMENT: simd

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build all executables
    cmds:
      - for: { var: BINS }
        task: build:one
        vars:
          NAME: "{{.ITEM}}"

  build:one:
    internal: true
    requires:
      vars: [NAME]
    cmds:
      - go build -trimpath -o {{.BIN_DIR}}/{{.NAME}}.exe ./cmd/{{.NAME}}
    sources:
      - cmd/{{.NAME}}/**/*.go
    generates:
      - "{{.BIN_DIR}}/{{.NAME}}.exe"

  build:shakespeare:
    cmds:
      - task: build:one
        vars:
          NAME: shakespeare
  
  build:shakespeare-lstm:
    cmds:
      - task: build:one
        vars:
          NAME: shakespeare-lstm

  build:logic_gates:
    cmds:
      - task: build:one
        vars:
          NAME: logic_gates

  build:ndigits:
    cmds:
      - task: build:one
        vars:
          NAME: ndigits

  run:
    desc: Run a command
    requires:
      vars: [NAME]
    cmds:
      - go run ./cmd/{{.NAME}}

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Remove built binaries
    cmds:
      - rm -rf {{.BIN_DIR}}